<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miniproyecto 1 - Formulario de Cotización Tech</title>
    <!-- CDN de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <!-- Tarjeta contenedora del formulario -->
                <div class="card bg-secondary text-white shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">
                        
                        <h2 class="text-center fw-bold mb-3">Cotización de Hardware</h2>
                        <p class="text-center text-light mb-4 small">Complete sus datos y requerimientos para recibir un presupuesto personalizado.</p>

                        <!-- Formulario con validación de HTML5/Bootstrap -->
                        <form class="needs-validation" novalidate id="formCotizacion">
                            
                            <!-- Nombre Completo -->
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre y Apellido</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Ej: Ignacio Montagna" required>
                                <div class="invalid-feedback">Por favor, ingrese su nombre completo.</div>
                            </div>

                            <!-- Correo Electrónico -->
                            <div class="mb-3">
                                <label for="email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
                                <div class="invalid-feedback">Ingrese un correo electrónico válido.</div>
                            </div>

                            <!-- Selección de Categoria -->
                            <div class="mb-3">
                                <label for="categoria" class="form-label">Componente de interés</label>
                                <select class="form-select" id="categoria" required>
                                    <option value="" selected disabled>Seleccione una opción...</option>
                                    <option value="fuente">Fuente de Poder / Placa</option>
                                    <option value="gabinete">Gabinete / Periféricos</option>
                                    <option value="monitor">Monitores / Pantallas</option>
                                    <option value="armado">Armado de PC Completa</option>
                                </select>
                                <div class="invalid-feedback">Por favor, seleccione una categoría.</div>
                            </div>

                            <!-- Detalle / Consulta -->
                            <div class="mb-3">
                                <label for="mensaje" class="form-label">Detalle de la consulta</label>
                                <textarea class="form-control" id="mensaje" rows="3" placeholder="Escriba especificaciones o presupuesto estimado..." required></textarea>
                                <div class="invalid-feedback">Ingrese un mensaje para la cotización.</div>
                            </div>

                            <!-- Checkbox de Términos -->
                            <div class="mb-4 form-check">
                                <input type="checkbox" class="form-check-input" id="terminos" required>
                                <label class="form-check-label small" for="terminos">Acepto los términos y condiciones de servicio</label>
                                <div class="invalid-feedback">Debe aceptar los términos antes de enviar.</div>
                            </div>

                            <!-- Botón de Envío -->
                            <div class="d-grid">
                                <button class="btn btn-info btn-lg fw-bold text-dark" type="submit">Enviar Cotización</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Bootstrap 5 y Validación JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Script de validación estándar de Bootstrap
        (() => {
            'use strict'
            const forms = document.querySelectorAll('.needs-validation')
            Array.from(forms).forEach(form => {
                form.addEventListener('submit', event => {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    } else {
                        event.preventDefault()
                        alert('¡Cotización enviada con éxito! Nos pondremos en contacto a la brevedad.')
                        form.reset()
                        form.classList.remove('was-validated')
                        return
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
